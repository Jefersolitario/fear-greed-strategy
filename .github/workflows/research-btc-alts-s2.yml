name: research-btc-alts-s2

# Research only: public order-book snapshots, no API key, no orders. Size check: the cost of crossing today's
# spot books with 1,000 and 10,000 USD for the current top 100. Runs only on the research branch.
on:
  push:
    branches: ["claude/research-btc-alts"]
    paths:
      - "research/btc-alts/s2_depth.py"
      - ".github/workflows/research-btc-alts-s2.yml"

permissions:
  contents: write

concurrency:
  group: research-btc-alts-s2
  cancel-in-progress: true

jobs:
  run:
    if: github.ref == 'refs/heads/claude/research-btc-alts'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install numpy==2.5.5 "requests>=2.31"
      - name: Order-book snapshots
        working-directory: research/btc-alts
        run: python s2_depth.py
      - name: Commit compact outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/btc-alts/out/s2 || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "research(btc-alts): order-book cost of 1,000 and 10,000 USD for the current top 100" \
                     -m "Co-Authored-By: Claude Fable 5.2 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01P1dahfAEk7SjXso6WjuRK2"
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/research-btc-alts && git push origin HEAD:claude/research-btc-alts && break
            sleep $((i * 5))
          done
