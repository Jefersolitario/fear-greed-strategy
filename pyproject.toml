[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fear-greed-strategy"
version = "0.1.0"
description = "Buy bitcoin when the Crypto Fear & Greed index is low: backtest, paper trading and published results"
requires-python = ">=3.11"
dependencies = ["polars>=1.0", "numpy>=1.26", "fsspec>=2024.2", "requests>=2.31"]

[project.optional-dependencies]
gcs = ["gcsfs>=2024.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
