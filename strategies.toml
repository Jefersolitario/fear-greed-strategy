# Every [[strategy]] is tested in the backtest. Those with paper = true are paper traded and published.
# role = "monitor" publishes a strategy for comparison only: dashboards show it but leave it out of portfolio totals.
# 17 Nov 2026: the portfolio keeps only the sell-at-80 rule. The hold rules stay here as tested variants.
# 18 Nov 2026: an index of exactly 10 now buys ("buy at 10, sell at 80"). The rule got a new id, fng_le10_sell80,
# because a different rule has a different history. No paper fill had happened under the old one.
source = "fear-greed-strategy"
backtest_start = "2018-02-01"   # first day of the Fear & Greed index
paper_start = "2026-11-18"      # paper books start flat on this UTC day; the rules were committed before it

[[strategy]]
id = "fng10_hold"
name = "F&G under 10, hold"
threshold = 10
description = "Buy 1,000 USD of BTC at the UTC close of every day the Crypto Fear & Greed index is below 10. Never sell."

[[strategy]]
id = "fng20_below_2y_avg"
name = "F&G under 20, price below 2-year average"
threshold = 20
price_filter = "below_ma730"
description = "Buy 1,000 USD of BTC at the UTC close of every day the index is below 20, provided the previous close was below its 730-day average. Never sell."

[[strategy]]
id = "fng20_hold"
name = "F&G under 20, hold"
threshold = 20

# 21 Nov 2026: the portfolio rule now reads CoinMarketCap's Fear and Greed index (cmc_le10_sell80). A rule on another
# index is a different rule: it has its own id, its own backtest, which can only start with that index in June 2023, and
# a paper book that starts flat. The rule on Alternative.me's index keeps running below, for comparison only.
[[strategy]]
id = "cmc_le10_sell80"
name = "CMC F&G 10 or lower, sell all at 80"
index = "cmc"
threshold = 10
inclusive = true
sell_all_at = 80
paper = true
backtest_start = "2023-06-30"   # the day after CoinMarketCap's first value
paper_start = "2026-11-21"      # the rule must be on main before this UTC day ends
description = "Buy 1,000 USD of BTC at the UTC close of every day on which CoinMarketCap's Fear and Greed value of the day before is 10 or lower. Sell the whole position at the UTC close of the first day on which that value is at or above 80."

[[strategy]]
id = "fng_le10_sell80"
name = "F&G 10 or lower, sell all at 80"
threshold = 10
inclusive = true
sell_all_at = 80
paper = true
role = "monitor"
description = "Monitoring only since 21 Nov 2026, when the portfolio moved to CoinMarketCap's index. Buy 1,000 USD of BTC at the UTC close of every day Alternative.me's index is 10 or lower. Sell the whole position at the UTC close of the first day the index is at or above 80."

[[strategy]]
id = "fng_le15_sell80"
name = "F&G 15 or lower, sell all at 80"
threshold = 15
inclusive = true
sell_all_at = 80
paper = true
role = "monitor"
description = "Monitoring only, not part of the portfolio. Buy 1,000 USD of BTC at the UTC close of every day the index is 15 or lower. Sell the whole position at the UTC close of the first day the index is at or above 80."

[[strategy]]
id = "fng10_sell80"
name = "F&G under 10, sell all at 80"
threshold = 10
sell_all_at = 80

[[strategy]]
id = "fng20_mayer"
name = "F&G under 20, Mayer multiple below 0.8"
threshold = 20
price_filter = "mayer_below_0.8"
